apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    version: {{ .Chart.AppVersion }}
    # Dynatrace uses these labels for management zones and tagging
    environment: production
    team: platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        version: {{ .Chart.AppVersion }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          # Environment variables from values.yaml
          env:
            - name: SERVICES_ORDER-SERVICE_URL
              value: {{ .Values.env.ORDER_SERVICE_URL }}
            - name: SERVICES_INVENTORY-SERVICE_URL
              value: {{ .Values.env.INVENTORY_SERVICE_URL }}
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: {{ .Values.env.OTEL_COLLECTOR_URL }}/v1/traces
          # Health checks - Kubernetes restarts pod if these fail
          livenessProbe:
            httpGet:
              path: /orders/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /orders/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 5
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
