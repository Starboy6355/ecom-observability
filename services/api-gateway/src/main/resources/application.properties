# Service name - appears in Dynatrace and traces
spring.application.name=api-gateway
server.port=8080

# Actuator - expose all endpoints including /actuator/prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Tracing - send 100% of traces to OTel Collector
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

# Logging
logging.level.root=INFO
logging.level.com.ecom=DEBUG

# Other service URLs (overridden by Helm values in Kubernetes)
services.order-service.url=http://order-service:8081
services.inventory-service.url=http://inventory-service:8082
